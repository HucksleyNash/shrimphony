name: shrimphony
description: "A focused Jellyfin music player for Android, iOS, and the car."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.2'

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_secure_storage: ^11.0.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/shrimphony_icon.png
